<html lang="en">
<head>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Arial', sans-serif; }
#container { position: relative; width: 100%; height: 100%; }
#canvas { width: 100%; height: 100%; display: block; z-index: 1; position: relative; }
#hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
.hidden { display: none !important; }
/* HUD Elements */
.bar-container { position: absolute; left: 20px; bottom: 20px; width: 200px; height: 20px; background: rgba(0,0,0,0.5); border: 2px solid #fff; border-radius: 4px; pointer-events: none; z-index: 10; }
.bar-fill { height: 100%; border-radius: 2px; transition: width 0.3s ease; }
.crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 32px; height: 32px; pointer-events: none; z-index: 10; }
.crosshair-dot { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 4px; height: 4px; background: rgba(255,255,255,0.8); border-radius: 50%; }
.crosshair-line { position: absolute; background: rgba(255,255,255,0.4); transform-origin: center; }
.crosshair-line.l1 { width: 2px; height: 12px; top: -14px; left: 50%; transform: translateX(-50%); }
.crosshair-line.l2 { width: 2px; height: 12px; bottom: -6px; left: 50%; transform: translateX(-50%); }
.crosshair-line.l3 { width: 12px; height: 2px; left: -6px; top: 50%; transform: translateY(-50%); }
.crosshair-line.l4 { width: 12px; height: 2px; right: -6px; top: 50%; transform: translateY(-50%); }
#health-bar { top: 60px; position: absolute; left: 20px; bottom: 20px; }
#rage-bar { top: 85px; position: absolute; left: 20px; bottom: 20px; }
.minimap-container { position: absolute; top: 20px; right: 20px; width: 160px; height: 160px; background: rgba(0,0,0,0.7); border: 2px solid #fff; border-radius: 4px; pointer-events: none; overflow: hidden; z-index: 10; }
.minimap { width: 100%; height: 100%; }
.screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 20; pointer-events: auto; }
.btn { padding: 12px 30px; font-size: 18px; background: #d4af37; color: #000; border: 2px solid #fff; border-radius: 4px; cursor: pointer; font-weight: bold; margin: 10px; transition: all 0.2s; }
.btn:hover { background: #e6c200; transform: scale(1.05); }
.btn:active { transform: scale(0.98); }
#start-screen { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); }
#pause-menu { background: rgba(0,0,0,0.9); }
#cutscene { background: rgba(0,0,0,0.95); }
.cutscene-text { color: #fff; font-size: 24px; text-align: center; max-width: 600px; line-height: 1.6; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }
.cutscene-skip { position: absolute; bottom: 20px; color: #d4af47; font-size: 14px; text-align: center; width: 100%; }
#tutorial { position: absolute; bottom: 100px; left: 20px; background: rgba(0,0,0,0.7); color: #fff; padding: 15px; border-radius: 8px; max-width: 300px; font-size: 14px; border: 1px solid #d4af37; pointer-events: none; }
.achievement-popup { position: absolute; top: 100px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.9); color: #d4af37; padding: 15px 30px; border-radius: 8px; border: 2px solid #d4af37; font-weight: bold; animation: fadeSlideUp 3s forwards; pointer-events: none; }
@keyframes fadeSlideUp { 0% { opacity: 0; transform: translate(-50%, 20px); } 10% { opacity: 1; } 90% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -20px); } }
@keyframes titleGlow { 0%, 100% { text-shadow: 4px 4px 8px rgba(0,0,0,0.8), 0 0 20px rgba(212,175,55,0.3); } 50% { text-shadow: 4px 4px 8px rgba(0,0,0,0.8), 0 0 30px rgba(212,175,55,0.8); } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
.title { font-size: 64px; font-weight: bold; color: #d4af47; text-shadow: 4px 4px 8px rgba(0,0,0,0.8); margin-bottom: 20px; animation: titleGlow 2s infinite; }
.subtitle { font-size: 20px; color: #fff; margin-bottom: 30px; animation: pulse 1.5s infinite; }
#cutscene { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 30; display: flex; align-items: center; justify-content: center; }
.cutscene-text { color: #fff; font-size: 24px; text-align: center; max-width: 600px; line-height: 1.6; }
.cutscene-skip { position: absolute; bottom: 20px; color: #d4af37; font-size: 14px; }
.mobile-btns { position: absolute; bottom: 20px; right: 20px; display: flex; gap: 10px; z-index: 20; }
.mobile-btn { padding: 15px 20px; font-size: 14px; background: rgba(212,175,55,0.7); color: #000; border: 2px solid #fff; border-radius: 8px; cursor: pointer; font-weight: bold; }
.joystick-container { position: absolute; bottom: 80px; left: 20px; width: 100px; height: 100px; background: rgba(0,0,0,0.3); border-radius: 50%; z-index: 20; touch-action: none; }
.joystick { position: absolute; top: 50%; left: 50%; width: 50px; height: 50px; background: rgba(255,255,255,0.6); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
#critical-mass { position: absolute; top: 60px; right: 20px; background: rgba(0,0,0,0.7); color: #d4af37; padding: 10px; border-radius: 8px; border: 1px solid #d4af37; font-size: 14px; z-index: 10; pointer-events: none; }
</style>

<body>

  <div id="hud">
    <div class="crosshair" id="crosshair"><div class="crosshair-dot"></div><div class="crosshair-line l1"></div><div class="crosshair-line l2"></div><div class="crosshair-line l3"></div><div class="crosshair-line l4"></div></div>

    <div>Critical Mass: <span id="cm-progress">0</span> / <span id="cm-target">10000</span></div>
  </div>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/tsl/TSL.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
    "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/WebGPU.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { color, vec2, vec3, vec4, float, uniform, attribute, varying, instanceIndex, mix } from 'three/tsl';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { MotionBlurPass } from 'three/addons/postprocessing/MotionBlurPass.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

// Game constants
const WORLD_SIZE = 4000;
const WORLD_HALF = WORLD_SIZE / 2;
const GRAVITY = -30;
const PLAYER_HEIGHT = 12;
const CONFIG = {
  colorblind: 'normal',
  reducedMotion: false,
  masterVolume: 0.8,
  sfxVolume: 0.7,
  musicVolume: 0.5
};

// Global state
let state = {
  game: 'loading',
  score: 0,
  rage: 0,
  health: 100,
  maxHealth: 100,
  combo: 0,
  comboTimer: 0,
  jumpStreak: 0,
  jumpStreakTimer: 0,
  wave: 0,
  rampageZones: { downtown: false, industrial: false, bridge: false },
  unlocks: { sizeBoost: false, infiniteRage: false },
  criticalMass: 0,
  criticalMassTarget: 10000,
  criticalMassReached: false,
  stats: { destroyedCars: 0, destroyedBuildings: 0, punchesThrown: 0, enemiesKilled: 0, distanceTraveled: 0, maxCombo: 0, rageUsed: 0 },
  activePowerups: {},
  powerupTimers: {},
  cutscene: false,
  tutorialStep: 0,
  tutorialDone: JSON.parse(localStorage.getItem('tutorialDone') || 'false'),
  skins: { redShirt: false },
  selectedSkin: 'default',
  lastChunkX: 0,
  lastChunkZ: 0
};

console.log('The Incredible Bulk - Initializing...');

let renderer, scene, camera, composer, controls, clock;
let canvas, canvas2d;
let gpuSupported = false;
let webglFallback = false;

async function initRenderer() {
  canvas = document.getElementById('canvas');
  canvas2d = document.getElementById('minimap');

  // Check WebGPU support
  if (await THREE.WebGPURenderer.isWebGPUContextAvailable()) {
     renderer = new THREE.WebGPURenderer({
      canvas: canvas,
      antialias: true,
      alpha: false,
      depth: true,
      stencil: true,
    });
    gpuSupported = true;
    console.log('WebGPU supported!');
  } else {
    // Fallback to WebGL
    renderer = new THREE.WebGLRenderer({
      canvas: canvas,
      antialias: true,
      alpha: false,
    });
    webglFallback = true;
    console.warn('WebGPU not available, falling back to WebGL');
  }

  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87ceeb);
  scene.fog = new THREE.FogExp2(0x87ceeb, 0.0003);

  camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.5, 8000);
  camera.position.set(0, 15, 30);

  clock = new THREE.Clock();
}

// ========================
// Lighting & Environment
// ========================
function setupLighting() {
  // Ambient light
  const ambient = new THREE.AmbientLight(0xffffff, 0.4);
  scene.add(ambient);

  // Directional light (sun)
  const sun = new THREE.DirectionalLight(0xffffff, 1.5);
  sun.position.set(100, 300, 100);
  sun.castShadow = true;
  sun.shadow.camera.left = -400;
  sun.shadow.camera.right = 400;
  sun.shadow.camera.top = 400;
  sun.shadow.camera.bottom = -400;
  sun.shadow.camera.near = 1;
  sun.shadow.camera.far = 1000;
  sun.shadow.mapSize.set(4096, 4096);
  sun.shadow.bias = -0.0001;
  scene.add(sun);
  scene.userData.sun = sun;

  // Hemisphere light for sky bounce
  const hemi = new THREE.HemisphereLight(0x87ceeb, 0x444422, 0.3);
  scene.add(hemi);

  // Volumetric fog light
  if (gpuSupported) {
    // Will be enhanced with TSL volumetric fog
  }
}

// ========================
// Post-Processing
// ========================
let postProcessingPasses = {};

function setupPostProcessing() {
  if (webglFallback) {
    composer = new EffectComposer(renderer);
    const renderPass = new RenderPass(scene, camera);
    composer.addPass(renderPass);
    return;
  }

  // WebGPU TSL post-processing
  composer = new EffectComposer(renderer);

  const renderPass = new RenderPass(scene, camera);
  composer.addPass(renderPass);

  const bloomPass = new UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    1.5, 0.4, 0.85
  );
  postProcessingPasses.bloom = bloomPass;
  composer.addPass(bloomPass);

  // Motion blur for high-speed action
  if (gpuSupported) {
    const motionBlurPass = new MotionBlurPass({
      jitterStrength: 2.0,
      jitterSamples: 8,
    });
    motionBlurPass.enabled = false; // Enable dynamically for high-speed jumps
    postProcessingPasses.motionBlur = motionBlurPass;
    composer.addPass(motionBlurPass);
  }

  // God rays
   const godRayPass = new ShaderPass({
     uniforms: {
       time: { value: 0 },
       cameraPos: { value: new THREE.Vector3() },
       sunDir: { value: new THREE.Vector3() },
     },
    vertexShader: `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform float time;
      uniform vec3 cameraPos;
      uniform vec3 sunDir;
      uniform sampler2D tDiffuse;
      varying vec2 vUv;
      void main() {
        vec2 uv = vUv;
        vec3 sunPos = cameraPos + sunDir * 1000.0;
        vec2 sunScreen = (sunPos.xy / 2000.0) + 0.5;

        vec3 col = texture(tDiffuse, uv).rgb;
        float dist = length(uv - sunScreen);
        float godRay = 0.0;
        for (int i = 0; i < 16; i++) {
          float t = float(i) / 16.0;
          vec2 p = mix(uv, sunScreen, t * 0.3);
          godRay += (0.05 / dist) * (1.0 - t);
        }
        godRay *= 0.3;
        col += godRay * vec3(1.0, 0.9, 0.6);

        // Vignette
        float vignette = 1.0 - length(uv - 0.5) * 0.5;
        col *= vignette;

        gl_FragColor = vec4(col, 1.0);
      }
    `,
  });
  postProcessingPasses.godRay = godRayPass;
  composer.addPass(godRayPass);
}

// ========================
// Window Resize
// ========================
window.addEventListener('resize', onWindowResize);

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer?.setSize(window.innerWidth, window.innerHeight);
  if (canvas2d) {
    canvas2d.width = 160;
    canvas2d.height = 160;
  }
}

// ========================
// Input Manager
// ========================
const Input = {
  keys: {},
  mouse: { x: 0, y: 0, lx: 0, ly: 0, button: 0, moveX: 0, moveY: 0, locked: false },
  touches: [],
  init() {
    window.addEventListener('keydown', (e) => { this.keys[e.code] = true; if (e.code === 'KeyP') togglePause(); });
    window.addEventListener('keyup', (e) => { this.keys[e.code] = false; });
    window.addEventListener('mousedown', (e) => { this.mouse.button = e.button; });
    window.addEventListener('mouseup', (e) => { this.mouse.button = -1; });
    window.addEventListener('mousemove', (e) => {
      this.mouse.lx = this.mouse.x; this.mouse.ly = this.mouse.y;
      this.mouse.x = e.clientX; this.mouse.y = e.clientY;
      this.mouse.moveX = e.movementX || 0; this.mouse.moveY = e.movementY || 0;
    });
    window.addEventListener('wheel', (e) => { this.mouse.wheelDelta = e.deltaY; }, { passive: true });
    // Touch
    window.addEventListener('touchstart', (e) => {
      for (let i = 0; i < e.touches.length; i++) { this.touches.push({ id: e.touches[i].identifier, x: e.touches[i].clientX, y: e.touches[i].clientY }); }
      e.preventDefault();
    }, { passive: false });
    window.addEventListener('touchmove', (e) => {
      this.touches.length = 0;
      for (let i = 0; i < e.touches.length; i++) { this.touches.push({ id: e.touches[i].identifier, x: e.touches[i].clientX, y: e.touches[i].clientY }); }
      e.preventDefault();
    }, { passive: false });
    window.addEventListener('touchend', () => { this.touches.length = Math.max(0, this.touches.length - 1); });
    // Pointer lock - click to lock
    const canvasEl = document.getElementById('canvas');
    canvasEl.addEventListener('click', () => {
      if (state.game === 'playing' && !state.cutscene) canvasEl.requestPointerLock();
    });
    document.addEventListener('pointerlockchange', () => { this.mouse.locked = !!document.pointerLockElement; });
    // Prevent context menu (right-click = grab)
    window.addEventListener('contextmenu', (e) => { e.preventDefault(); return false; });
    // Save on exit
    window.addEventListener('beforeunload', () => saveGame());
  },
  isPressed(key) { return this.keys[key] || false; },
  isJustPressed(key) { return this.keys[key] === true && !this._prevKeys?.[key]; },
  resetFrame() { this._prevKeys = { ...this.keys }; this.mouse.wheelDelta = 0; },
  clearMouseDelta() { this.mouse.moveX = 0; this.mouse.moveY = 0; }
};

// ========================
// TSL Skin Shader Material
// ========================
const SkinShaderMaterial = {
  create(gpuSupported) {
    if (gpuSupported && typeof vec3 === 'function') {
      return this.createWebGPUMaterial();
    }
    return this.createWebGLMaterial();
  },

   createWebGPUMaterial() {
    const material = new THREE.MeshStandardNodeMaterial();
    material.color = color(0xf5d6c6);
    material.metalness = float(0.1);
    material.roughness = float(0.7);
    material.thickness = float(0.8);
    material.thicknessColor = color(0xf5d6c6);
    material.clearcoat = float(0.05);
    material.clearcoatRoughness = float(0.1);
    // Rage emissive: transitions from black to red glow
    const rageLevel = uniform(0);
    SkinShaderMaterial._rageUniform = rageLevel;
    material.emissive = mix(color(0x000000), color(0xff0000), rageLevel);
    material.emissiveIntensity = mix(float(0), float(1), rageLevel);
    return material;
   },

  createWebGLMaterial() {
    return new THREE.MeshPhysicalMaterial({
      color: 0xf5d6c6, metalness: 0.1, roughness: 0.7,
      thickness: 0.8, thicknessColor: new THREE.Color(0xf5d6c6),
      clearcoat: 0.05, clearcoatRoughness: 0.1,
      emissive: new THREE.Color(0x000000), emissiveIntensity: 0,
      side: THREE.FrontSide,
    });
  },
};

// ========================
// Bulk Character
// ========================
let bulk = null;

class BulkCharacter {
  constructor() {
    this.group = new THREE.Group(); this.group.name = 'bulk';
    this.meshes = {}; this.geos = {}; this.mats = {};
    this.morphParams = { muscleFlex: 0, rage: 0, size: 1, height: PLAYER_HEIGHT };
    this.rage = 0; this.rageActive = false; this.rageTimer = 0; this.maxRage = 100;
    this.sizeBoostActive = false; this.sizeBoostTimer = 0;
    this.jumpStreak = 0; this.jumpStreakTimer = 0; this.maxJumpStreak = 5;
    this.velocity = new THREE.Vector3(); this.onGround = false;
    this.position = new THREE.Vector3(0, 200, 0);
    this.facing = new THREE.Vector3(0, 0, 1);
    this.targetLook = new THREE.Vector3(0, 0, 0);
    this.health = state.health; this.maxHealth = state.maxHealth;
    this.combo = 0; this.comboTimer = 0;
    this.isGrabbing = false; this.grabTarget = null;
    this.isPunching = false; this.punchTimer = 0;
    this.isSlamming = false; this.isClapping = false; this.canSmash = false;
    this.cape = null; this.shirtRemnants = []; this.shadow = null; this.skinMaterial = null;
  }

  create() {
    this.createGeometry(); this.createMaterials(); this.assembleModel(); this.createShadow();
    this.group.position.copy(this.position); scene.add(this.group);
    bulk = this; console.log('Bulk character created');
  }

  createGeometry() {
    this.geos = {
      head: new THREE.SphereGeometry(1.2, 32, 32),
      torso: new THREE.CapsuleGeometry(1.8, 3.5, 8, 32),
      armR: new THREE.CapsuleGeometry(1.2, 4, 6, 32),
      armL: new THREE.CapsuleGeometry(1.2, 4, 6, 32),
      legR: new THREE.CapsuleGeometry(1.4, 4, 6, 32),
      legL: new THREE.CapsuleGeometry(1.4, 4, 6, 32),
      handR: new THREE.SphereGeometry(1.3, 24, 24),
      handL: new THREE.SphereGeometry(1.3, 24, 24),
      shirt1: new THREE.PlaneGeometry(3.5, 3),
      shirt2: new THREE.PlaneGeometry(3.5, 3),
      shirt3: new THREE.PlaneGeometry(3.5, 3),
    };
  }

  createMaterials() {
    this.skinMaterial = SkinShaderMaterial.create(gpuSupported);
    const clothMat = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.05, roughness: 0.9, side: THREE.DoubleSide, transparent: true, opacity: 0.9 });
    const pantsMat = new THREE.MeshStandardMaterial({ color: 0x1a1a2e, metalness: 0.1, roughness: 0.8 });
    const emissiveMat = new THREE.MeshBasicMaterial({ color: 0xff0000, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false });
    this.mats = { skin: this.skinMaterial, cloth: clothMat, pants: pantsMat, emissive: emissiveMat };
  }

  assembleModel() {
    this.meshes.head = this.makeMesh(this.geos.head, this.mats.skin, 0, 1.8);
    this.meshes.torso = this.makeMesh(this.geos.torso, this.mats.skin, 0, -0.2);

    // Arms with groups for animation
    this.meshes.armR = this.makeMesh(this.geos.armR, this.mats.skin, -2.2, 0.2);
    this.meshes.armL = this.makeMesh(this.geos.armL, this.mats.skin, 2.2, 0.2);
    this.meshes.handR = this.makeMesh(this.geos.handR, this.mats.skin, 0, -4.5);
    this.meshes.handL = this.makeMesh(this.geos.handL, this.mats.skin, 0, -4.5);

    this.meshes.armRGroup = new THREE.Group(); this.meshes.armRGroup.add(this.meshes.armR, this.meshes.handR);
    this.meshes.armLGroup = new THREE.Group(); this.meshes.armLGroup.add(this.meshes.armL, this.meshes.handL);
    this.meshes.armRGroup.position.set(-2.2, 0.2, 0); this.meshes.armLGroup.position.set(2.2, 0.2, 0);
    this.group.add(this.meshes.armRGroup, this.meshes.armLGroup);

    this.meshes.legR = this.makeMesh(this.geos.legR, this.mats.skin, 0, -4.2);
    this.meshes.legL = this.makeMesh(this.geos.legL, this.mats.skin, 0.3, -4.2);
    this.meshes.legRGroup = new THREE.Group(); this.meshes.legRGroup.add(this.meshes.legR);
    this.meshes.legLGroup = new THREE.Group(); this.meshes.legLGroup.add(this.meshes.legL);
    this.meshes.legRGroup.position.set(0, -4.5, 0); this.meshes.legLGroup.position.set(0.3, -4.5, 0);
    this.group.add(this.meshes.legRGroup, this.meshes.legLGroup);

    // Shirt remnants
    for (let i = 0; i < 3; i++) {
      const s = this.makeMesh(this.geos[`shirt${i+1}`], this.mats.cloth, 0, 0.6 + i * 0.4);
      s.rotation.y = i * 0.3 - 0.3; this.shirtRemnants.push(s); this.group.add(s);
    }

    // Pants
    const p1 = this.makeMesh(new THREE.PlaneGeometry(3, 4), this.mats.pants, 0, -1.5); p1.rotation.y = Math.PI; p1.position.z = 1.5;
    const p2 = this.makeMesh(new THREE.PlaneGeometry(3, 4), this.mats.pants, 0, -1.5); p2.rotation.y = 0; p2.position.z = -1.5;
    this.meshes.pants1 = p1; this.meshes.pants2 = p2; this.group.add(p1, p2);

    // Emissive vein overlay
    this.meshes.vein = this.makeMesh(this.geos.torso, this.mats.emissive, 0, -0.2);
    this.meshes.vein.scale.setScalar(1.03); this.group.add(this.meshes.vein);
  }

  makeMesh(geo, mat, x, y) {
    const m = new THREE.Mesh(geo, mat);
    m.castShadow = true; m.receiveShadow = true; m.position.set(x, y, 0); return m;
  }

  createShadow() {
    const geo = new THREE.CircleGeometry(3, 32);
    const mat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.4, side: THREE.DoubleSide, depthWrite: false });
    this.shadow = new THREE.Mesh(geo, mat); this.shadow.rotation.x = -Math.PI / 2; this.shadow.position.y = -6.5;
    this.group.add(this.shadow);
  }

  update(deltaTime) {
    this.updateRage(deltaTime); this.updateSizeBoost(deltaTime); this.updateJumpStreak(deltaTime);
    this.updateAnimations(deltaTime); this.updatePunchTimer(deltaTime);
  }

  updatePunchTimer(deltaTime) {
    if (this.punchTimer > 0) this.punchTimer -= deltaTime;
    if (this.punchTimer <= 0) { this.isPunching = false; this.isSlamming = false; this.isClapping = false; }
  }

  startRage() {
    if (state.rage >= 100 || state.unlocks.infiniteRage) {
      this.rageActive = true; this.rageTimer = 15; this.rage = 100; state.rage = 0;
      this.morphParams.rage = 1; state.stats.rageUsed = (state.stats.rageUsed || 0) + 1;
      this.canSmash = true;
      playSound('roar');
      showCutscene("RAGE MODE ACTIVATED! The Bulk grows to 20 meters, veins glowing red!");
    }
  }

  bulkSmash() {
    if (!this.rageActive || !this.canSmash) return;
    this.canSmash = false;
    this.isSlamming = true; this.punchTimer = 2;
    this.velocity.y = -150;
    // Massive shockwave
    createShockwave(this.group.position, 80);
    createShockwave(this.group.position, 40);
    // Damage nearby buildings
    buildings.forEach(b => {
      if (b.userData && b.userData.destructible && b.position.distanceTo(this.group.position) < 60) {
        damageBuilding(b, 99999, b.position);
      }
    });
    // Knockback enemies
    GameObjectManager.getByType('enemy').forEach(e => {
      const dir = e.group.position.clone().sub(this.group.position).normalize();
      if (e.knockback) e.knockback(dir, 200); else { e.group.position.addScaledVector(dir, 10); }
      e.takeDamage(99999);
    });
    // Screen shake effect
    camera.shake = { intensity: 2, duration: 1, time: 0 };
    playSound('slam');
    playSound('explosion');
    state.score += 5000;
    state.rage = 0;
    showTutorial("BULK SMASH! Everything within range is destroyed!");
  }

  jump(power = 1) {
    if (!this.onGround) return false;
    this.onGround = false;
    this.velocity.y = Math.min(80, 40 + this.jumpStreak * 10) * power;
    this.jumpStreak = Math.min(this.maxJumpStreak, this.jumpStreak + 1);
    this.jumpStreakTimer = 1.5;
    this.morphParams.height = PLAYER_HEIGHT * (1 + this.jumpStreak * 0.2);
    if (this.jumpStreak >= this.maxJumpStreak) showTutorial("MAX JUMP STREAK! Keep bouncing to stay at peak height!");
    return true;
  }

  slam() {
    if (this.isSlamming) return; this.isSlamming = true; this.punchTimer = 2; this.velocity.y = -100;
    createShockwave(this.group.position, 20); playSound('slam');
  }

  clap() {
    if (this.isClapping) return; this.isClapping = true; this.punchTimer = 1.5;
    createShockwave(this.group.position, 15);
    GameObjectManager.getByType('enemy').forEach(e => { const d = e.group.position.clone().sub(bulk.group.position).normalize(); e.knockback(d, 50); });
    playSound('clap');
  }

  punch(heavy = false) {
    if (this.isPunching) return 0;
    this.isPunching = true; this.punchTimer = heavy ? 1.5 : 0.8;
    const target = this.targetLook.clone().sub(this.group.position).normalize();
    const pos = this.group.position.clone().add(target.multiplyScalar(5));
    createImpactEffect(pos, target); playSound(heavy ? 'punch_heavy' : 'punch_light');
    return heavy ? 80 : 40;
  }

   updateRage(deltaTime) {
    if (this.rageActive) {
      this.rageTimer -= deltaTime;
      this.health = Math.min(this.maxHealth, this.health + deltaTime * 20);
      if (this.rageTimer <= 0) { this.rageActive = false; this.rage = 0; this.morphParams.rage = 0; }
    }
    const intensity = this.rageActive ? 0.8 + Math.sin(performance.now() * 0.02) * 0.2 : 0;
    this.morphParams.rage = this.rageActive ? Math.min(1, this.rageTimer / 15) : 0;
    // Update TSL skin shader rage uniform
    if (gpuSupported && SkinShaderMaterial._rageUniform) {
      SkinShaderMaterial._rageUniform.value = this.morphParams.rage;
    }
    if (this.mats.emissive) this.mats.emissive.opacity = intensity * 0.5;
  }

  updateSizeBoost(deltaTime) {
    if (this.sizeBoostActive) {
      this.sizeBoostTimer -= deltaTime;
      if (this.sizeBoostTimer <= 0) this.sizeBoostActive = false;
      this.morphParams.size = 1 + (state.unlocks.sizeBoost ? 0.5 : 0) * (this.sizeBoostActive ? 1 : 0);
    } else this.morphParams.size = 1;
    this.group.scale.setScalar(this.morphParams.size);
  }

  updateJumpStreak(deltaTime) {
    this.jumpStreakTimer -= deltaTime;
    if (this.jumpStreakTimer <= 0) { this.jumpStreak = 0; this.morphParams.height = PLAYER_HEIGHT * this.morphParams.size; }
  }

  updateAnimations(deltaTime) {
    const speed = this.velocity.length();
    this.morphParams.muscleFlex = Math.min(1, speed * 0.1);
    this.shirtRemnants.forEach((s, i) => { s.rotation.y = Math.sin(performance.now() * 2 + i) * 0.1 + i * 0.3; });
  }

  grab(target) { this.isGrabbing = true; this.grabTarget = target; this.velocity.set(0, 0, 0); }
  throw(target, trajectory) { if (target) target.throw(trajectory); this.isGrabbing = false; this.grabTarget = null; }
  takeDamage(amount) { const amt = this.rageActive ? amount * 0.5 : amount; this.health -= amt; if (this.health <= 0) this.onDeath(); return this.health; }
  onDeath() { showCutscene("GAME OVER!"); setTimeout(() => { state.game = 'gameOver'; updateUI(); }, 3000); }
}

// ========================
// Physics System
// ========================
class PhysicsSystem {
  constructor() {
    this.rigidbodies = []; this.colliders = []; this.debris = []; this.dt = 1/60;
  }
  add(object, mass = 0, type = 'static') {
    const body = { object: object, group: object.group || object,
      position: (object.group || object).position || new THREE.Vector3(),
      velocity: new THREE.Vector3(), acceleration: new THREE.Vector3(0, GRAVITY, 0),
      mass: mass, inverseMass: mass > 0 ? 1/mass : 0, type: type, onGround: false,
      radius: object.radius || 2, health: object.health || 100, maxHealth: object.health || 100 };
    if (type === 'dynamic') this.rigidbodies.push(body); else this.colliders.push(body);
    object.body = body; this.colliders.push(body); return body;
  }
  update(deltaTime) {
    this.dt = Math.min(deltaTime, 0.016);
    for (const b of this.rigidbodies) {
      b.acceleration.y = GRAVITY;
      b.velocity.addScaledVector(b.acceleration, this.dt);
      b.position.addScaledVector(b.velocity, this.dt);
      b.velocity.multiplyScalar(Math.pow(0.98, this.dt * 60));
      this.checkCollisions(b);
    }
    for (let i = this.debris.length - 1; i >= 0; i--) {
      const d = this.debris[i];
      d.velocity.y += GRAVITY * this.dt * 0.5;
      d.position.addScaledVector(d.velocity, this.dt);
      d.life -= this.dt; d.velocity.multiplyScalar(0.98);
      if (d.life <= 0 || d.position.y < -100) { this.debris.splice(i, 1); if (d.mesh) scene.remove(d.mesh); }
    }
  }
  checkCollisions(body) {
    const pos = body.position, r = body.radius;
    if (pos.y < r) { pos.y = r; body.velocity.y = 0; body.onGround = true; } else body.onGround = false;
    for (const c of this.colliders) {
      if (c === body) continue;
      const dist = pos.distanceTo(c.position), minDist = r + (c.radius || 2);
      if (dist < minDist) {
        const normal = pos.clone().sub(c.position).normalize();
        const overlap = minDist - dist;
        pos.addScaledVector(normal, overlap * 0.5);
        if (body.inverseMass > 0) body.velocity.addScaledVector(normal, -body.velocity.dot(normal) * 0.5);
      }
    }
  }
  applyImpulse(body, impulse) { if (body.inverseMass > 0) body.velocity.addScaledVector(impulse, body.inverseMass); }
}

// ========================
// GameObject Manager
// ========================
class GameObjectManager {
  static objects = []; static pools = {};
  static add(obj, type = 'generic') { obj.type = type; obj.active = true; this.objects.push(obj); }
  static getByType(type) { return this.objects.filter(o => o.type === type && o.active); }
  static update(deltaTime) {
    for (let i = this.objects.length - 1; i >= 0; i--) {
      const obj = this.objects[i];
      if (!obj.active) { this.objects.splice(i, 1); if (obj.group) scene.remove(obj.group); continue; }
      if (obj.update) obj.update(deltaTime);
    }
  }
  static getNearest(type, pos, maxDist = 100) {
    const objs = this.getByType(type); let nearest = null; let minDist = maxDist;
    for (const o of objs) { const d = o.group.position.distanceTo(pos); if (d < minDist) { minDist = d; nearest = o; } }
    return nearest;
  }
  static clearAll() { this.objects.forEach(o => { if (o.onDestroy) o.onDestroy(); if (o.group) scene.remove(o.group); }); this.objects = []; this.pools = {}; }
}

// ========================
// Particle System
// ========================
class ParticleSystem {
  static particles = [];
  static create(pos, count, type = 'dust', color = 0x8b7355) {
    const group = new THREE.Group(); group.position.copy(pos);
    const positions = new Float32Array(count * 3);
    const velocities = new Float32Array(count * 3);
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2; const v = 5 + Math.random() * 15;
      velocities[i*3] = Math.cos(a) * v; velocities[i*3+1] = Math.random() * 10 + 5; velocities[i*3+2] = Math.sin(a) * v;
      positions[i*3] = (Math.random() - 0.5) * 2; positions[i*3+1] = (Math.random() - 0.5) * 2; positions[i*3+2] = (Math.random() - 0.5) * 2;
    }
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const material = new THREE.PointsMaterial({ size: 0.5 + Math.random(), sizeAttenuation: true, color: color, transparent: true, opacity: 0.8, depthWrite: false, blending: THREE.AdditiveBlending });
    const points = new THREE.Points(geometry, material); group.add(points);
    const particleObj = { group, velocities, life: 2 + Math.random() * 2, type };
    scene.add(group); this.particles.push(particleObj); GameObjectManager.add(particleObj, 'particle'); return particleObj;
  }
  static update(deltaTime) {
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i]; p.life -= deltaTime;
      const posAttr = p.group.children[0].geometry.attributes.position;
      for (let j = 0; j < p.velocities.length; j += 3) {
        p.velocities[j+1] += GRAVITY * deltaTime * 0.3;
        posAttr.array[j] += p.velocities[j] * deltaTime; posAttr.array[j+1] += p.velocities[j+1] * deltaTime; posAttr.array[j+2] += p.velocities[j+2] * deltaTime;
        p.velocities[j] *= 0.98; p.velocities[j+1] *= 0.98; p.velocities[j+2] *= 0.98;
      }
      posAttr.needsUpdate = true;
      p.group.children[0].material.opacity = Math.max(0, p.life / 2 * 0.8);
      if (p.life <= 0) { scene.remove(p.group); this.particles.splice(i, 1); p.active = false; }
    }
  }
}

// ========================
// Sound System
// ========================
const SoundBank = {
  ctx: null, enabled: true,
  init() { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { this.enabled = false; } },
  play(sound, volume = 1) {
    if (!this.enabled || !this.ctx || state.cutscene) return;
    try {
      let buf;
      if (sound === 'punch_light') buf = this.genBuf(0.2, (t) => t > 0.15 ? 0 : 0.3 * Math.sin(440 * t * Math.PI * 2) * Math.exp(-t * 30) * Math.sin(t * 200));
      else if (sound === 'punch_heavy') buf = this.genBuf(0.2, (t) => t > 0.15 ? 0 : 0.8 * Math.sin(220 * t * Math.PI * 2) * Math.exp(-t * 30) * Math.sin(t * 200));
      else if (sound === 'slam') buf = this.genBuf(0.5, (t) => t > 0.4 ? 0 : 0.9 * Math.sin(60 * t * Math.PI * 2) * Math.exp(-t * 10) + 0.5 * Math.sin(10 * t * Math.PI * 2) * Math.exp(-t * 5));
      else if (sound === 'clap') buf = this.genBuf(0.2, (t) => t > 0.1 ? 0 : 0.6 * Math.exp(-t * 30) * (Math.random() - 0.5));
      else if (sound === 'explosion') buf = this.genBuf(0.6, (t) => t > 0.5 ? 0 : 0.8 * Math.sin(40 * t * Math.PI * 2) * Math.exp(-t * 8) * (Math.random() - 0.5) * 2);
      else if (sound === 'roar') buf = this.genBuf(1.5, (t) => t > 1.4 ? 0 : 0.4 * Math.sin((100 + Math.sin(t * 5) * 50) * t * Math.PI * 2) * Math.exp(-t * 2) * Math.sin(t * 30));
      else if (sound === 'jump') buf = this.genBuf(0.3, (t) => t > 0.25 ? 0 : 0.3 * Math.sin(880 * t * Math.PI) * Math.exp(-t * 10) * Math.sin(t * 100));
      else buf = this.genBuf(0.2, (t) => t > 0.15 ? 0 : 0.5 * Math.sin(330 * t * Math.PI * 2) * Math.exp(-t * 30));
      const source = this.ctx.createBufferSource(); source.buffer = buf;
      const gain = this.ctx.createGain(); gain.gain.value = volume * CONFIG.sfxVolume * CONFIG.masterVolume;
      source.connect(gain).connect(this.ctx.destination); source.start(0);
    } catch(e) { console.warn('Sound failed:', e); }
  },
  genBuf(duration, func) {
    const sr = this.ctx.sampleRate; const frames = sr * duration;
    const buf = this.ctx.createBuffer(1, frames, sr); const data = buf.getChannelData(0);
    for (let i = 0; i < frames; i++) data[i] = func(i / sr, i, frames);
    return buf;
  },
};
function playSound(name, vol = 1) { SoundBank.play(name, vol); }

// Effects
// ========================
function createImpactEffect(pos, normal) {
  ParticleSystem.create(pos, 30, 'dust', 0xffaa00);
  const ringGeo = new THREE.RingGeometry(1, 1.5, 32);
  const ringMat = new THREE.MeshBasicMaterial({ color: 0xffaa00, side: THREE.DoubleSide, transparent: true, opacity: 0.8, depthWrite: false });
  const ring = new THREE.Mesh(ringGeo, ringMat); ring.position.copy(pos);
  scene.add(ring); setTimeout(() => scene.remove(ring), 500);
}

function createShockwave(pos, radius) {
  ParticleSystem.create(pos, 50, 'dust', 0xff4444);
  const geo = new THREE.RingGeometry(0.1, radius * 0.3, 64);
  const mat = new THREE.MeshBasicMaterial({ color: 0xff4444, side: THREE.DoubleSide, transparent: true, opacity: 0.6, depthWrite: false });
  const wave = new THREE.Mesh(geo, mat); wave.position.copy(pos); wave.rotation.x = -Math.PI/2;
  scene.add(wave); const t = performance.now();
  const anim = () => {
    const e = (performance.now() - t) / 500;
    wave.scale.setScalar(1 + e * 3); wave.material.opacity = Math.max(0, 0.6 - e);
    if (e < 1) requestAnimationFrame(anim); else scene.remove(wave);
  };
  anim();
}

function createDebris(pos, count = 10) {
  for (let i = 0; i < count; i++) {
    const geo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
    const mat = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.8 });
    const d = new THREE.Mesh(geo, mat); d.position.copy(pos); d.castShadow = true; d.receiveShadow = true;
    scene.add(d);
    physics.applyImpulse(physics.add(d, 1, 'dynamic'), new THREE.Vector3((Math.random()-0.5)*30, Math.random()*20+10, (Math.random()-0.5)*30));
    setTimeout(() => scene.remove(d), 5000);
  }
}

// ========================
// Camera
// ========================
let cameraOffset = new THREE.Vector3(0, 15, -30);
let cameraTarget = new THREE.Vector3();
let cameraSmooth = 0.05;

function updateCamera(mouseDelta, dt) {
  if (!bulk) return;
  if (mouseDelta) {
    cameraOffset.applyAxisAngle(new THREE.Vector3(1, 0, 0), -mouseDelta.y * 0.001);
    cameraOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), -mouseDelta.x * 0.001);
  }
  if (!bulk.onGround) {
    cameraSmooth = 0.02 + Math.abs(bulk.velocity.y) * 0.0001;
    cameraOffset.lerp(new THREE.Vector3(0, 30, -50), 0.1);
  } else {
    cameraSmooth = Math.min(0.1, 0.05 + bulk.velocity.length() * 0.001);
    cameraOffset.lerp(new THREE.Vector3(0, 15, -30), 0.05);
  }
  const targetPos = bulk.group.position.clone().add(new THREE.Vector3(0, 5, 0));
  cameraTarget.lerp(targetPos, cameraSmooth);
  camera.position.lerp(cameraTarget.clone().add(cameraOffset), cameraSmooth);
  camera.lookAt(bulk.group.position.clone().add(new THREE.Vector3(0, 5, 0)));

  // Camera shake
  if (camera.shake) {
    if (camera.shake.time < camera.shake.duration) {
      const intensity = camera.shake.intensity * (1 - camera.shake.time / camera.shake.duration);
      camera.position.x += (Math.random() - 0.5) * intensity;
      camera.position.y += (Math.random() - 0.5) * intensity;
      camera.position.z += (Math.random() - 0.5) * intensity;
      camera.shake.time += dt;
    } else {
      delete camera.shake;
    }
  }
}

// ========================
// Minimap
// ========================
let minimapCtx = null;
function initMinimap() { minimapCtx = canvas2d.getContext('2d'); }
function updateMinimap() {
  if (!minimapCtx || !bulk) return;
  const size = 160; minimapCtx.clearRect(0, 0, size, size);
  minimapCtx.fillStyle = '#224422'; minimapCtx.fillRect(0, 0, size, size);
  minimapCtx.strokeStyle = '#446644'; minimapCtx.lineWidth = 0.5;
  for (let i = 0; i <= 8; i++) { minimapCtx.beginPath(); minimapCtx.moveTo(i*20, 0); minimapCtx.lineTo(i*20, size); minimapCtx.stroke(); minimapCtx.beginPath(); minimapCtx.moveTo(0, i*20); minimapCtx.lineTo(size, i*20); minimapCtx.stroke(); }
  minimapCtx.fillStyle = '#555555';
  buildings.forEach(b => { const bx = (b.position.x / WORLD_SIZE + 0.5) * size; const bz = (b.position.z / WORLD_SIZE + 0.5) * size; const s = Math.max(1, b.userData.height / 30); minimapCtx.fillRect(bx - s/2, bz - s/2, s, s); });
  const px = (bulk.group.position.x / WORLD_SIZE + 0.5) * size;
  const pz = (bulk.group.position.z / WORLD_SIZE + 0.5) * size;
  minimapCtx.fillStyle = '#ff0000'; minimapCtx.beginPath(); minimapCtx.arc(px, pz, 3, 0, Math.PI*2); minimapCtx.fill();
  minimapCtx.fillStyle = '#ff8800';
  GameObjectManager.getByType('enemy').forEach(e => { const ex = (e.group.position.x / WORLD_SIZE + 0.5) * size; const ez = (e.group.position.z / WORLD_SIZE + 0.5) * size; minimapCtx.beginPath(); minimapCtx.arc(ex, ez, 2, 0, Math.PI*2); minimapCtx.fill(); });
}

function updateGameplay(delta) {
  const dt = delta; const b = bulk; if (!b) return;

  if (Input.isJustPressed('KeyR') && (state.rage >= 100 || state.unlocks.infiniteRage)) b.startRage();
  if (b.rageActive && Input.isJustPressed('KeyR')) b.bulkSmash();
  if (Input.isJustPressed('KeyQ') && b.rageActive) b.slam();
  if (Input.isJustPressed('KeyE') && b.rageActive) b.clap();
  if (Input.isJustPressed('Space') && b.jump()) playSound('jump');
  if (Input.isPressed('Digit1')) activatePowerup('health');
  if (Input.isPressed('Digit2')) activatePowerup('rage');
  if (Input.isPressed('Digit3')) activatePowerup('size');
  if (Input.isPressed('Digit4')) activatePowerup('speed');

  const moveDir = new THREE.Vector3();
  if (Input.isPressed('KeyW')) moveDir.z -= 1;
  if (Input.isPressed('KeyS')) moveDir.z += 1;
  if (Input.isPressed('KeyA')) moveDir.x -= 1;
  if (Input.isPressed('KeyD')) moveDir.x += 1;
  if (moveDir.lengthSq() > 0) {
    moveDir.normalize();
    const cam = camera; const forward = new THREE.Vector3(); cam.getWorldDirection(forward); forward.y = 0; forward.normalize();
    const right = new THREE.Vector3(); right.crossVectors(new THREE.Vector3(0,1,0), forward).normalize();
    const move = forward.multiplyScalar(moveDir.z).add(right.multiplyScalar(moveDir.x));
    b.velocity.x += move.x * 15 * dt; b.velocity.z += move.z * 15 * dt; b.facing.copy(move);
  }
  b.velocity.x *= Math.pow(0.9, dt * 60); b.velocity.z *= Math.pow(0.9, dt * 60);
  b.velocity.y += GRAVITY * dt;
  b.group.position.addScaledVector(b.velocity, dt);

  if (b.group.position.y <= PLAYER_HEIGHT * b.morphParams.size) { b.group.position.y = PLAYER_HEIGHT * b.morphParams.size; b.velocity.y = 0; b.onGround = true; } else b.onGround = false;
  if (b.facing.lengthSq() > 0.1) b.group.lookAt(b.group.position.clone().add(b.facing));
  b.update(dt);

  // Mouse look and camera
  const mouseDelta = new THREE.Vector2(Input.mouse.moveX, Input.mouse.moveY);
  updateCamera(mouseDelta, dt);
  if (Input.mouse.locked) {
    const targetPos = bulk.group.position.clone();
    // Update look target for punches
    b.targetLook = camera.position.clone().add(camera.getWorldDirection(new THREE.Vector3()).multiplyScalar(30));
    if (Input.mouse.button === 0 && !b.isPunching && !b.isGrabbing && !b.rageActive) {
      b.punch(Input.isPressed('KeyW') || Input.isPressed('KeyA') || Input.isPressed('KeyS') || Input.isPressed('KeyD'));
      addCombo();
    }
    if (Input.mouse.button === 2) {
      if (!b.isGrabbing) {
        const target = GameObjectManager.getNearest('car', b.group.position, 30);
        if (target) { b.grab(target); } else if (Input.isPressed('KeyW')) { b.velocity.y = Math.max(b.velocity.y, 0); b.velocity.add(b.facing.clone().multiplyScalar(30)); }
      } else { b.throw(b.grabTarget, camera.getWorldDirection(new THREE.Vector3())); }
    }
    Input.clearMouseDelta();
  }

  state.rage = Math.min(100, state.rage + dt * (b.rageActive ? -10 : 2));
  state.health = b.health;
  state.comboTimer -= dt;
  if (state.comboTimer <= 0 && state.combo > 0) { state.combo = 0; state.comboTimer = 0; }
  updateEnemies(dt);
  checkRampageZones();
  spawnOrbs();

  if (Math.floor(b.group.position.x / 1000) !== state.lastChunkX || Math.floor(b.group.position.z / 1000) !== state.lastChunkZ) {
    state.lastChunkX = Math.floor(b.group.position.x / 1000); state.lastChunkZ = Math.floor(b.group.position.z / 1000); saveGame();
  }
  state.score += b.velocity.length() * dt * 0.1;
  // Check critical mass
  if (state.criticalMass >= state.criticalMassTarget && !state.criticalMassReached) {
    state.criticalMassReached = true;
    showAchievement("CRITICAL MASS REACHED! Endless Mode Unlocked!");
    state.unlocks.infiniteRage = true;
    showCutscene("CRITICAL MASS ACHIEVED!\n\nThe Bulk has reached maximum chaos!\nEndless mode is now unlocked.\nSurvive as long as you can against endless waves!");
    setTimeout(() => { hideCutscene(); state.game = 'playing'; }, 3000);
  }
  updateUI();
}

function addCombo() { state.comboTimer = 2; state.combo++; state.stats.maxCombo = Math.max(state.stats.maxCombo, state.combo); state.rage = Math.min(100, state.rage + 5); state.score += state.combo * 10; updateUI(); }

function activatePowerup(type) {
  if (!state.activePowerups[type]) return;
  const b = bulk;
  if (type === 'rage') { state.rage = 100; b.startRage(); state.activePowerups[type] = false; }
  else if (type === 'health') { b.health = b.maxHealth; state.health = b.maxHealth; state.activePowerups[type] = false; }
  else if (type === 'size') { b.sizeBoostActive = true; b.sizeBoostTimer = 10; state.activePowerups[type] = false; showTutorial("Size Boost activated!"); }
  else if (type === 'speed') { state.activePowerups[type] = false; b.velocity.multiplyScalar(3); showTutorial("Speed Boost activated!"); }
}

function updateEnemies(delta) {
  waveTimer += delta;
  if (waveTimer > 10) { waveTimer = 0; spawnEnemyWave(); }
  GameObjectManager.getByType('enemy').forEach(e => { if (e.update) e.update(delta); });
}

function spawnEnemyWave() {
  const b = bulk; if (!b) return;
  currentWave++; state.wave = currentWave;
  const angles = [Math.random()*Math.PI*2, Math.random()*Math.PI*2 + Math.PI/2];
  const types = currentWave <= 2 ? ['soldier'] : currentWave <= 4 ? ['soldier','drone'] : currentWave <= 6 ? ['soldier','drone','tank'] : ['soldier','drone','tank','chopper'];
  angles.forEach((a, i) => {
    const pos = b.group.position.clone().add(new THREE.Vector3(Math.cos(a)*250, 0, Math.sin(a)*250));
    setTimeout(() => { const type = types[Math.floor(Math.random()*types.length)]; spawnEnemy(pos, type); }, i * 500);
  });
  if (currentWave % 3 === 0) {
    state.cutscene = true;
    const texts = ["WAVE " + currentWave + " INCOMING!\nMilitary forces deploying reinforcements.\nBULK SMASH!", "WAVE " + currentWave + "!\nElite units: Tanks and helicopters!\nBULK IS TOO BULK!", "WAVE " + currentWave + " - FINAL!\nFull military arsenal unleashed!\nBULK SMASH EVERYTHING!"];
    showCutscene(texts[Math.min(Math.floor(currentWave / 3) - 1, texts.length - 1)]);
    setTimeout(hideCutscene, 3000);
  }
  if (currentWave === 3 && !state.rampageZones.downtown) { state.rampageZones.downtown = true; showAchievement("Downtown Unlocked!"); }
  if (currentWave === 6 && !state.rampageZones.industrial) { state.rampageZones.industrial = true; showAchievement("Industrial Unlocked!"); }
  if (currentWave === 9 && !state.rampageZones.bridge) { state.rampageZones.bridge = true; showAchievement("Bridge Unlocked!"); }
  if (currentWave === 5 && !state.unlocks.sizeBoost) { state.unlocks.sizeBoost = true; showAchievement("Size Boost Unlocked!"); state.activePowerups.size = true; }
  if (currentWave === 8 && !state.unlocks.infiniteRage) { state.unlocks.infiniteRage = true; showAchievement("Infinite Rage Unlocked!"); }
}

function spawnEnemy(pos, type) {
  let group;
  if (type === 'soldier') {
    group = new THREE.Group();
    const m = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 0.5), new THREE.MeshStandardMaterial({ color: 0x00aa00 }));
    group.add(m); group.position.copy(pos); group.position.y = 5;
     const enemy = { group, type: 'enemy', health: 50, update: makeEnemyAI(20), takeDamage: function(d) { this.health -= d; if (this.health <= 0) { this.active = false; state.stats.enemiesKilled++; state.score += 100; state.criticalMass += 20; createImpactEffect(this.group.position, new THREE.Vector3(0,-1,0)); } }, active: true };
    scene.add(group); GameObjectManager.add(enemy, 'enemy');
  } else if (type === 'drone') {
    group = new THREE.Group();
    const m = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 16), new THREE.MeshStandardMaterial({ color: 0x888888, emissive: 0x4444ff }));
    group.add(m); group.position.copy(pos); group.position.y = 50;
     const enemy = { group, type: 'enemy', health: 30, update: makeDroneAI(15), takeDamage: function(d) { this.health -= d; if (this.health <= 0) { this.active = false; state.stats.enemiesKilled++; state.score += 150; state.criticalMass += 30; } }, active: true };
    scene.add(group); GameObjectManager.add(enemy, 'enemy');
  } else if (type === 'tank') {
    group = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(3, 2, 5), new THREE.MeshStandardMaterial({ color: 0x336600 }));
    const turret = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 4), new THREE.MeshStandardMaterial({ color: 0x336600 }));
    turret.position.z = 4; group.add(body, turret);
    group.position.copy(pos); group.position.y = 5;
     const enemy = { group, type: 'enemy', health: 300, update: makeTankAI(30), takeDamage: function(d) { this.health -= d; state.score += 50; state.criticalMass += 100; if (this.health <= 0) { this.active = false; state.stats.enemiesKilled++; state.score += 500; createShockwave(this.group.position, 30); } }, active: true };
    scene.add(group); GameObjectManager.add(enemy, 'enemy');
  } else if (type === 'chopper') {
    group = new THREE.Group();
    const m = new THREE.Mesh(new THREE.ConeGeometry(2, 4, 8), new THREE.MeshStandardMaterial({ color: 0xddaa00 }));
    m.rotation.z = Math.PI / 2; const rotor = new THREE.Mesh(new THREE.PlaneGeometry(6, 0.5), new THREE.MeshBasicMaterial({ color: 0x444444, side: THREE.DoubleSide }));
    rotor.rotation.x = Math.PI / 2; group.add(m, rotor);
    group.position.copy(pos); group.position.y = 100;
     const enemy = { group, type: 'enemy', health: 100, update: makeChopperAI(40), takeDamage: function(d) { this.health -= d; if (this.health <= 0) { this.active = false; state.stats.enemiesKilled++; state.score += 300; state.criticalMass += 50; } }, active: true };
    scene.add(group); GameObjectManager.add(enemy, 'enemy');
  }
}

function makeEnemyAI(speed) {
  return function(delta) {
    const dir = bulk.group.position.clone().sub(this.group.position).normalize(); dir.y = 0;
    this.group.position.addScaledVector(dir, speed * delta);
    this.group.lookAt(bulk.group.position);
    // Shooting
    this.shootTimer = (this.shootTimer || 0) - delta;
    if (this.shootTimer <= 0 && !this.isGrabbing) {
      this.shootTimer = 1 + Math.random() * 2;
      const projGeo = new THREE.SphereGeometry(0.3, 8, 8);
      const projMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
      const proj = new THREE.Mesh(projGeo, projMat);
      proj.position.copy(this.group.position); proj.position.y += 2;
      proj.userData = { velocity: dir.clone().multiplyScalar(30), life: 5, owner: this };
      scene.add(proj); GameObjectManager.add({ group: { position: proj.position }, type: 'projectile', update: updateProjectile, active: true, takeDamage: (d) => {} }, 'projectile');
      playSound('punch_light', 0.3);
    }
  };
}

function updateProjectile(delta) {
  this.group.position.addScaledVector(this.group.userData.velocity, delta);
  this.group.userData.life -= delta;
  if (this.group.userData.life <= 0 || this.group.position.distanceTo(bulk.group.position) > 500) {
    this.active = false; scene.remove(this.group);
  }
  // Hit detection
  if (this.group.position.distanceTo(bulk.group.position) < 5) {
    this.active = false; scene.remove(this.group);
    bulk.takeDamage(5);
    ParticleSystem.create(this.group.position, 10, 'dust', 0xff0000);
  }
}

function makeDroneAI(speed) {
  return function(delta) {
    const dir = bulk.group.position.clone().add(new THREE.Vector3(0, 10, 0)).sub(this.group.position).normalize();
    this.group.position.addScaledVector(dir, speed * delta);
    this.group.rotation.y += delta;
  };
}

function makeTankAI(speed) {
  return function(delta) {
    const dir = bulk.group.position.clone().sub(this.group.position).normalize(); dir.y = 0;
    this.group.position.addScaledVector(dir, speed * delta * 0.3);
    this.group.lookAt(bulk.group.position);
  };
}

function makeChopperAI(speed) {
  return function(delta) {
    this.group.position.y = Math.max(50, this.group.position.y + Math.sin(performance.now() * 0.5) * 2);
    const dir = bulk.group.position.clone().sub(this.group.position).normalize();
    this.group.position.addScaledVector(dir, speed * delta * 0.5);
  };
}

function checkRampageZones() {
  if (!bulk) return;
  const pos = bulk.group.position;
  const dist = (x, z) => Math.sqrt((pos.x - x)**2 + (pos.z - z)**2);
  if (state.rampageZones.downtown && dist(-1500, -1500) < 200 && !state.rampageZones._dtv) { state.rampageZones._dtv = true; showAchievement("Downtown Reached!"); state.score += 1000; }
  if (state.rampageZones.industrial && dist(1500, 1500) < 200 && !state.rampageZones._itv) { state.rampageZones._itv = true; showAchievement("Industrial Reached!"); state.score += 1000; }
  if (state.rampageZones.bridge && dist(0, 3000) < 200 && !state.rampageZones._btv) { state.rampageZones._btv = true; showAchievement("Bridge Reached!"); state.score += 2000; }
}

function spawnOrbs() {
  if (Math.random() < 0.005) {
    const pos = new THREE.Vector3(bulk.group.position.x + (Math.random()-0.5)*200, bulk.group.position.y, bulk.group.position.z + (Math.random()-0.5)*200);
    const orbGeo = new THREE.SphereGeometry(0.5, 16, 16);
    const orbMat = new THREE.MeshBasicMaterial({ color: 0x00ffaa, transparent: true, opacity: 0.7, blending: THREE.AdditiveBlending });
    const orb = new THREE.Mesh(orbGeo, orbMat); orb.position.copy(pos); orb.position.y = 10;
    scene.add(orb); const t = performance.now();
    const anim = () => {
      const e = (performance.now() - t) / 2000;
      orb.rotation.y += 0.1; orb.material.opacity = Math.max(0, 0.7 - e);
      const d = orb.position.distanceTo(bulk.group.position);
      if (d < 5) { state.rage = Math.min(100, state.rage + 5); state.score += 10; scene.remove(orb); }
      else if (e < 1) requestAnimationFrame(anim); else { if (orb.parent) scene.remove(orb); }
    };
    anim();
  }
}

function generateCity() {
  console.log('Generating city...');
  const group = new THREE.Group();
  scene.add(group);

  // Ground
  const groundGeo = new THREE.PlaneGeometry(WORLD_SIZE, WORLD_SIZE);
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x336622 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; ground.name = 'ground';
  group.add(ground);

  // Grid of buildings (150-200 buildings)
  const gridSize = 40; const cellSize = WORLD_SIZE / gridSize;
  let count = 0;
  for (let x = 0; x < gridSize; x++) {
    for (let z = 0; z < gridSize; z++) {
      // Leave roads at certain intervals
      if (x % 5 === 0 || z % 5 === 0) continue;
      if (Math.random() < 0.7) continue;

      const bx = (x - gridSize/2) * cellSize + cellSize/2;
      const bz = (z - gridSize/2) * cellSize + cellSize/2;
      const height = 20 + Math.random() * 130;
      const width = 10 + Math.random() * 30;
      const depth = 10 + Math.random() * 30;

      createBuilding(group, bx, bz, width, depth, height, count);
      count++;
    }
  }

  // Parks
  for (let i = 0; i < 5; i++) {
    const px = (Math.random() - 0.5) * WORLD_SIZE * 0.6;
    const pz = (Math.random() - 0.5) * WORLD_SIZE * 0.6;
    createPark(group, px, pz, 100 + Math.random() * 100);
  }

  // Roads
  createRoads(group);

  // River and bridge
  createRiver(group);

  // Highway overpass
  createOverpass(group);

  // Water towers, cranes, billboards
  for (let i = 0; i < 20; i++) createProp(group, (Math.random()-0.5)*WORLD_SIZE*0.8, (Math.random()-0.5)*WORLD_SIZE*0.8, 'crane');
  for (let i = 0; i < 30; i++) createProp(group, (Math.random()-0.5)*WORLD_SIZE*0.8, (Math.random()-0.5)*WORLD_SIZE*0.8, 'billboard');
  for (let i = 0; i < 15; i++) createProp(group, (Math.random()-0.5)*WORLD_SIZE*0.8, (Math.random()-0.5)*WORLD_SIZE*0.8, 'waterTower');

  // Cars
  for (let i = 0; i < 80; i++) {
    const cx = (Math.random()-0.5) * WORLD_SIZE * 0.9;
    const cz = (Math.random()-0.5) * WORLD_SIZE * 0.9;
    if (Math.abs(cx) < 5 || Math.abs(cz) < 5) continue;
    createVehicle(group, cx, cz);
  }

  // Starting platform
  createStartingPlatform(group);

  console.log('City generated with ' + count + ' buildings');
}

function createBuilding(group, x, z, w, d, h, id) {
  const geo = new THREE.BoxGeometry(w, h, d);
  const colors = [0x888888, 0xaaaaaa, 0x777777, 0x999999, 0xaaaaaa];
  const mat = new THREE.MeshStandardMaterial({ color: colors[Math.floor(Math.random()*colors.length)], roughness: 0.7, metalness: 0.2 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, h/2, z); mesh.castShadow = true; mesh.receiveShadow = true;
  mesh.name = 'building_' + id; mesh.userData = { id, height: h, health: h * 2, maxHealth: h * 2, destructible: h > 50 };
  mesh.userData.group = group;
  buildings.push(mesh);
  physics.add({ position: mesh.position, group: { position: mesh.position }, radius: Math.max(w, d) * 0.6, health: mesh.userData.health }, 0, 'static');
  group.add(mesh);
}

function createPark(group, x, z, size) {
  const geo = new THREE.PlaneGeometry(size, size);
  const mat = new THREE.MeshStandardMaterial({ color: 0x228822 });
  const mesh = new THREE.Mesh(geo, mat); mesh.rotation.x = -Math.PI/2; mesh.position.set(x, 0.1, z); mesh.receiveShadow = true;
  group.add(mesh);
  // Trees
  for (let i = 0; i < 10; i++) {
    const tx = x + (Math.random()-0.5) * size * 0.8;
    const tz = z + (Math.random()-0.5) * size * 0.8;
    const tree = createTree(); tree.position.set(tx, 0.1, tz); group.add(tree);
  }
}

function createTree() {
  const group = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.8, 3), new THREE.MeshStandardMaterial({ color: 0x8b4513 }));
  trunk.castShadow = true; trunk.position.y = 1.5;
  const leaves = new THREE.Mesh(new THREE.SphereGeometry(2, 16, 16), new THREE.MeshStandardMaterial({ color: 0x228822 }));
  leaves.castShadow = true; leaves.position.y = 3;
  group.add(trunk, leaves); return group;
}

function createRoads(group) {
  const roadMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
  for (let i = -1; i <= 1; i++) {
    const geo = new THREE.PlaneGeometry(WORLD_SIZE, 10);
    const mesh = new THREE.Mesh(geo, roadMat); mesh.rotation.x = -Math.PI/2; mesh.position.set(i * 500, 0.2, 0); mesh.receiveShadow = true;
    const mesh2 = mesh.clone(); mesh2.position.set(0, 0.2, i * 500);
    group.add(mesh, mesh2);
  }
}

function createRiver(group) {
  const geo = new THREE.PlaneGeometry(WORLD_SIZE * 0.2, 600);
  const mat = new THREE.MeshStandardMaterial({ color: 0x1144aa, transparent: true, opacity: 0.8 });
  const mesh = new THREE.Mesh(geo, mat); mesh.rotation.x = -Math.PI/2; mesh.position.set(0, 2, -1500); mesh.receiveShadow = true;
  group.add(mesh);
  // Bridge
  const bridgeGeo = new THREE.BoxGeometry(30, 2, 600);
  const bridge = new THREE.Mesh(bridgeGeo, new THREE.MeshStandardMaterial({ color: 0x555555 }));
  bridge.position.set(0, 4, -1500); bridge.castShadow = true;
  group.add(bridge);
  buildings.push(bridge);
  bridge.userData = { height: 0, health: 1000, maxHealth: 1000, destructible: true };
}

function createOverpass(group) {
  const supportGeo = new THREE.BoxGeometry(3, 50, 3);
  const deckGeo = new THREE.BoxGeometry(20, 3, 1000);
  const mat = new THREE.MeshStandardMaterial({ color: 0x444444 });
  for (let i = 0; i < 3; i++) {
    const s1 = new THREE.Mesh(supportGeo, mat); s1.position.set(-800 + i*400, 25, 1000); s1.castShadow = true; group.add(s1);
    const s2 = s1.clone(); s2.position.z = -1000; group.add(s2);
    const deck = new THREE.Mesh(deckGeo, mat); deck.position.set(-800 + i*400, 50, 0); deck.castShadow = true; group.add(deck);
    buildings.push(s1, s2, deck);
  }
}

function createProp(group, x, z, type) {
  const pos = new THREE.Vector3(x, 0, z);
  let mesh;
  if (type === 'crane') {
    const geo = new THREE.BoxGeometry(5, 60, 5); const mat = new THREE.MeshStandardMaterial({ color: 0xffaa00 });
    mesh = new THREE.Mesh(geo, mat); mesh.position.y = 30; mesh.castShadow = true;
  } else if (type === 'billboard') {
    const geo = new THREE.PlaneGeometry(20, 12); const mat = new THREE.MeshBasicMaterial({ color: 0xff0000, side: THREE.DoubleSide });
    mesh = new THREE.Mesh(geo, mat); mesh.position.y = 15; mesh.castShadow = true;
    // Funny billboard text
    const joke = ['BULK IS TOO BULK!', 'DEAD LIFTS > DEADLIFTS', 'MUSCLE OVER MIND', 'HULK? NEVER HEARD OF HER'][Math.floor(Math.random()*4)];
    mesh.userData.joke = joke;
  } else if (type === 'waterTower') {
    const geo = new THREE.CylinderGeometry(8, 8, 30, 32); const mat = new THREE.MeshStandardMaterial({ color: 0xffffff });
    mesh = new THREE.Mesh(geo, mat); mesh.position.y = 15; mesh.castShadow = true;
  }
  if (mesh) { mesh.position.x = x; group.add(mesh); buildings.push(mesh); }
}

function createVehicle(group, x, z) {
  const types = [
    { geo: new THREE.BoxGeometry(4, 1.5, 8), color: 0xff0000 },
    { geo: new THREE.BoxGeometry(5, 2, 10), color: 0x0000ff },
    { geo: new THREE.BoxGeometry(6, 2, 12), color: 0xffff00 },
    { geo: new THREE.BoxGeometry(3, 2, 7), color: 0x00ff00 },
  ];
  const t = types[Math.floor(Math.random()*types.length)];
  const mesh = new THREE.Mesh(t.geo, new THREE.MeshStandardMaterial({ color: t.color, roughness: 0.5 }));
  mesh.position.set(x, 2, z); mesh.castShadow = true; mesh.receiveShadow = true;
  mesh.userData = { type: 'car', health: 50, maxHealth: 50, speed: (Math.random()-0.5)*0.1 };
  group.add(mesh);
  GameObjectManager.add({ group: mesh, type: 'car', health: 50, update: function(d) { this.group.position.x += this.speed || 0.1; if (this.group.position.x > WORLD_HALF + 100) this.group.position.x = -WORLD_HALF - 100; } }, 'car');
}

// ========================
// Background Music System
// ========================
const MusicSystem = {
  ctx: null, buffers: {}, currentTrack: null, intensity: 0,
  init() {
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { console.warn('No audio context'); return; }
    this.createTrack('ambient', [220, 277, 330, 392], 0.1);
    this.createTrack('intense', [110, 131, 147, 165, 220, 277], 0.15);
    this.play('ambient');
  },
  createTrack(name, freqs, decay) {
    const sr = this.ctx.sampleRate; const duration = 0.5;
    const frames = sr * duration;
    const buf = this.ctx.createBuffer(1, frames, sr);
    const data = buf.getChannelData(0);
    for (let i = 0; i < frames; i++) {
      let s = 0;
      for (const f of freqs) {
        const t = i / sr;
        s += Math.sin(f * t * Math.PI * 2) * Math.exp(-t * decay) * 0.3;
      }
      data[i] = s * 0.3;
    }
    this.buffers[name] = buf;
  },
  play(name) {
    if (!this.ctx || this.currentTrack === name) return;
    this.currentTrack = name;
    const source = this.ctx.createBufferSource(); source.buffer = this.buffers[name];
    source.loop = true; const gain = this.ctx.createGain();
    gain.gain.value = CONFIG.musicVolume * CONFIG.masterVolume * 0.3;
    source.connect(gain).connect(this.ctx.destination); source.start(0);
    this.source = source; this.gain = gain;
  },
  updateMusic(intensity) {
    if (!this.gain || this.currentTrack === 'ambient') return;
    this.gain.gain.value = 0.3 * (0.3 + intensity * 0.7) * CONFIG.musicVolume * CONFIG.masterVolume;
  },
  setIntensity(i) {
    this.intensity = i;
    if (this.currentTrack === 'intense') this.updateMusic(i);
  },
  switchTo(intense) {
    if (intense && this.currentTrack !== 'intense') this.play('intense');
    else if (!intense && this.currentTrack !== 'ambient') this.play('ambient');
  },
};

// ========================
// Dynamic Time of Day
// ========================
const TimeOfDay = {
  time: 0, // 0-1 (dawn to dawn)
  targetTime: 0.3, // Late afternoon start
  update(deltaTime) {
    this.time = THREE.MathUtils.lerp(this.time, this.targetTime, 0.02);
    const t = this.time;
    // Update sun direction
    const sun = scene.userData.sun;
    if (sun) {
      const angle = (t - 0.25) * Math.PI * 2;
      sun.position.set(Math.cos(angle) * 300, Math.sin(angle) * 200 + 100, Math.sin(angle) * 150).multiplyScalar(1);
      sun.intensity = THREE.MathUtils.lerp(0.5, 2, Math.max(0, Math.sin(angle)));
    }
    // Update fog
    if (scene.fog) {
      const color = t < 0.25 || t > 0.75 ? new THREE.Color(0x112244) : new THREE.Color(0x87ceeb);
      scene.fog.color.lerp(color, 0.01);
      scene.fog.density = THREE.MathUtils.lerp(0.0003, 0.001, Math.abs(t - 0.5) * 2);
    }
    // Update sky gradient (via CSS)
    const skyEl = document.querySelector('#container');
    if (skyEl) skyEl.style.background = `linear-gradient(135deg, hsl(${t*360}, 60%, 40%), hsl(${t*360+30}, 50%, 20%))`;
  },
  setProgress(chaosLevel) {
    this.targetTime = THREE.MathUtils.lerp(0.3, 0.8, Math.min(1, chaosLevel / 100000));
  },
};

// ========================
// Enhanced Building Destruction
// ========================
function damageBuilding(mesh, damage, hitPos) {
  if (!mesh.userData || !mesh.userData.destructible) return;
  mesh.userData.health -= damage;
  state.stats.destroyedBuildings += 0; // Only count total destruction

  // Visual damage feedback
  if (mesh.material) {
    const original = mesh.material.color.clone();
    mesh.material.color.lerp(new THREE.Color(0x333333), damage / mesh.userData.maxHealth * 0.3);
  }

  // Cracks
  const crackCount = Math.floor(damage / 20);
  for (let i = 0; i < crackCount; i++) {
    if (Math.random() < 0.3) {
      const crackGeo = new THREE.PlaneGeometry(mesh.userData.width || 5, 0.3);
      const crackMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6, side: THREE.DoubleSide, depthWrite: false });
      const crack = new THREE.Mesh(crackGeo, crackMat);
      crack.position.copy(hitPos || mesh.position);
      crack.rotation.y = Math.random() * Math.PI;
      mesh.add(crack);
      setTimeout(() => mesh.remove(crack), 3000);
    }
  }

      if (mesh.userData.health <= 0) {
    destroyBuilding(mesh);
    state.stats.destroyedBuildings++;
    state.score += mesh.userData.height * 10;
    state.criticalMass += mesh.userData.height * 5;
    state.rage = Math.min(100, state.rage + 10);
    createShockwave(mesh.position, mesh.userData.height);
    createDebris(mesh.position, 20);
    playSound('explosion');
  }
}

function destroyBuilding(mesh) {
  mesh.userData.destructible = false;
  mesh.userData.health = 0;
  // Collapse effect
  const height = mesh.userData.height || 50;
  const w = mesh.userData.width || 20;
  const d = mesh.userData.depth || 20;
  const segments = Math.floor(height / 10);
  for (let i = 0; i < segments; i++) {
    const segGeo = new THREE.BoxGeometry(w, height/segments, d);
    const segMat = new THREE.MeshStandardMaterial({ color: mesh.material.color, roughness: 0.7 });
    const seg = new THREE.Mesh(segGeo, segMat);
    seg.position.y = mesh.position.y - (height/2) + i * height/segments;
    seg.castShadow = true;
    scene.add(seg);
    physics.applyImpulse(physics.add(seg, 5, 'dynamic'), new THREE.Vector3((Math.random()-0.5)*20, Math.random()*15+5, (Math.random()-0.5)*20));
    setTimeout(() => scene.remove(seg), 10000);
  }
  mesh.visible = false;
  setTimeout(() => { if (mesh.parent) mesh.parent.remove(mesh); }, 1000);
}

// ========================
// Accessibility Options
// ========================
const Accessibility = {
  apply() {
    // Colorblind mode
    if (CONFIG.colorblind !== 'normal') {
      const overlays = {
        deuteranopia: 'rgba(255,0,0,0.1)',
        protanopia: 'rgba(0,255,0,0.1)',
        tritanopia: 'rgba(0,0,255,0.1)',
      };
      const overlay = document.createElement('div');
      overlay.style.cssText = `position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5;background:${overlays[CONFIG.colorblind]||'transparent'}`;
      document.body.appendChild(overlay);
    }
    // Reduced motion
    if (CONFIG.reducedMotion) {
      const style = document.createElement('style');
      style.textContent = '*{animation-duration:0.01ms!important;transition-duration:0.01ms!important;animation-iteration-count:1!important;}';
      document.head.appendChild(style);
    }
  },
  toggleColorblind() {
    const modes = ['normal', 'deuteranopia', 'protanopia', 'tritanopia'];
    const idx = (modes.indexOf(CONFIG.colorblind) + 1) % modes.length;
    CONFIG.colorblind = modes[idx];
    saveConfig();
    location.reload();
  },
  toggleReducedMotion() {
    CONFIG.reducedMotion = !CONFIG.reducedMotion;
    saveConfig();
    location.reload();
  },
};

function saveConfig() { localStorage.setItem('bulkConfig', JSON.stringify(CONFIG)); }
function loadConfig() { const c = JSON.parse(localStorage.getItem('bulkConfig') || '{}'); Object.assign(CONFIG, c); }

// ========================
// Enhanced Animate Loop
// ========================
function animate() {
  if (animId === null) return;
  const delta = Math.min(clock.getDelta(), 0.05);
  Input.resetFrame();

  if (state.game === 'playing') {
    updateGameplay(delta);
    // Music intensity based on rage/wave
    MusicSystem.setIntensity(state.rage * 0.01);
    if (state.rage > 50) MusicSystem.switchTo(true); else MusicSystem.switchTo(false);
    TimeOfDay.update(delta);
    TimeOfDay.setProgress(state.score);
  }
  if (state.game === 'cutscene' && Input.isJustPressed('Space')) {
    hideCutscene(); state.game = 'playing';
    setTimeout(() => showTutorial("WASD to MOVE, SPACE to JUMP, Mouse to look. Left-click to PUNCH, Right-click to GRAB. R for RAGE!"), 500);
    setTimeout(() => showTutorial("Shift+Space for SUPER LEAP! Consecutive jumps get higher! (x5 max)"), 5000);
    setTimeout(() => {
      showTutorial("Q for SLAM, E for CLAP in Rage Mode! R again for BULK SMASH!");
      setTimeout(() => { state.tutorialDone = true; localStorage.setItem('tutorialDone', 'true'); }, 2000);
    }, 10000);
  }

  physics.update(delta);
  ParticleSystem.update(delta);
  GameObjectManager.update(delta);
  updateMinimap();

  // Update post-processing based on rage and velocity
  if (postProcessingPasses.godRay) {
    postProcessingPasses.godRay.uniforms.time.value = performance.now() * 0.001;
    if (bulk) {
      postProcessingPasses.godRay.uniforms.cameraPos.value = camera.position;
      if (scene.userData.sun) postProcessingPasses.godRay.uniforms.sunDir.value = scene.userData.sun.position.clone().normalize();
    }
  }
  if (postProcessingPasses.motionBlur && bulk) {
    postProcessingPasses.motionBlur.enabled = !CONFIG.reducedMotion && bulk.velocity.length() > 30;
  }
  if (postProcessingPasses.bloom) {
    const bloom = postProcessingPasses.bloom;
    bloom.strength = 1.5 + (state.rage / 100) * 2;
  }

  if (composer) composer.render(); else renderer.render(scene, camera);
  animId = requestAnimationFrame(animate);
}

function initMobileControls() {
  const isMobile = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
  if (isMobile) {
    document.getElementById('mobile-controls').classList.remove('hidden');
    document.getElementById('jump-btn').addEventListener('touchstart', (e) => { e.preventDefault(); Input.keys['Space'] = true; });
    document.getElementById('jump-btn').addEventListener('touchend', (e) => { e.preventDefault(); Input.keys['Space'] = false; });
    document.getElementById('punch-btn').addEventListener('touchstart', (e) => { e.preventDefault(); Input.mouse.button = 0; });
    document.getElementById('punch-btn').addEventListener('touchend', (e) => { e.preventDefault(); Input.mouse.button = -1; });
    document.getElementById('rage-btn').addEventListener('touchstart', (e) => { e.preventDefault(); Input.keys['KeyR'] = true; });
    document.getElementById('rage-btn').addEventListener('touchend', (e) => { e.preventDefault(); Input.keys['KeyR'] = false; });

    // Virtual joystick
    const js = document.getElementById('joystick'); let jsActive = false, startX = 0, startY = 0;
    const jc = document.getElementById('joystick-container');
    jc.addEventListener('touchstart', (e) => { jsActive = true; startX = e.touches[0].clientX; startY = e.touches[0].clientY; });
    jc.addEventListener('touchmove', (e) => {
      if (!jsActive) return;
      const x = e.touches[0].clientX - startX; const y = e.touches[0].clientY - startY;
      const dist = Math.sqrt(x*x + y*y); const maxDist = 40; const limited = Math.min(dist, maxDist);
      const angle = Math.atan2(y, x);
      js.style.transform = `translate(calc(-50% + ${Math.cos(angle)*limited}px), calc(-50% + ${Math.sin(angle)*limited}px))`;
      Input.keys['KeyW'] = y < -10; Input.keys['KeyS'] = y > 10;
      Input.keys['KeyA'] = x < -10; Input.keys['KeyD'] = x > 10;
    });
    jc.addEventListener('touchend', () => { jsActive = false; js.style.transform = 'translate(-50%, -50%)'; Input.keys['KeyW'] = false; Input.keys['KeyS'] = false; Input.keys['KeyA'] = false; Input.keys['KeyD'] = false; });
  }
}
